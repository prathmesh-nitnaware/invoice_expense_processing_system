# SonarQube Project Configuration
sonar.projectKey=invoice-expense-processing-system
sonar.projectName=AI-Powered Invoice & Expense Processing System
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# Code Coverage Integration
sonar.python.coverage.reportPaths=coverage.xml

# Inclusions & Exclusions
sonar.exclusions=**/node_modules/**,**/venv/**,**/dist/**,**/storage/**,**/.pytest_cache/**,**/coverage.xml,**/htmlcov/**,**/*.png,**/*.jpg,**/*.pdf,**/*.xlsx
sonar.test.inclusions=backend/tests/**

# Quality Gate Rules
sonar.qualitygate.wait=true
