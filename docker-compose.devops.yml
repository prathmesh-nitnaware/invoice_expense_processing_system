version: '3.8'

# Optional DevOps & Monitoring Toolchain
# Run via: docker compose -f docker-compose.devops.yml up -d
services:
  # ============================================================================
  # Continuous Integration & Delivery
  # ============================================================================
  jenkins:
    build:
      context: .
      dockerfile: devops/jenkins/Dockerfile
    container_name: invoice_jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--httpPort=8080
    volumes:
      - jenkins_home:/var/jenkins_home
      # Docker daemon socket for pipeline builds (documented in docs/DEVOPS_SETUP.md)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network

  # ============================================================================
  # Code Quality & Static Analysis
  # ============================================================================
  sonarqube:
    image: sonarqube:lts-community
    container_name: invoice_sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - app-network

  # ============================================================================
  # Metrics Collection (Prometheus)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: invoice_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - app-network

  # ============================================================================
  # Dashboards & Visualization (Grafana)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.3.3
    container_name: invoice_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-network

networks:
  app-network:
    name: invoice_app-network
    external: true

volumes:
  jenkins_home:
    name: invoice_jenkins_home
  sonarqube_data:
    name: invoice_sonarqube_data
  sonarqube_extensions:
    name: invoice_sonarqube_extensions
  sonarqube_logs:
    name: invoice_sonarqube_logs
  prometheus_data:
    name: invoice_prometheus_data
  grafana_data:
    name: invoice_grafana_data
